<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .bg { fill: #f5f6f8; }
      .card { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .top { fill: #111827; }
      .text { fill: #101828; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .muted { fill: #667085; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .mono { fill: #475467; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; }
      .pillOk { fill: #e8f7ee; stroke: #027a48; stroke-width: 2; }
      .pillWarn { fill: #fff7e6; stroke: #b54708; stroke-width: 2; }
      .pillBad { fill: #feecec; stroke: #b42318; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720" />
  <rect class="top" x="0" y="0" width="1280" height="56" />
  <text class="text" x="18" y="36" font-size="18" fill="#ffffff">Unified PMG Tracking Center</text>
  <text class="muted" x="1080" y="36" font-size="12" fill="#cbd5e1">OK (node1, node2, node3)</text>

  <rect class="card" x="16" y="76" width="1248" height="180" rx="14" />
  <text class="text" x="34" y="110" font-size="16">Tracking Center</text>
  <text class="muted" x="34" y="140" font-size="12">Sender / Receiver / Filter / Start / End</text>
  <rect x="34" y="154" width="340" height="38" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
  <rect x="394" y="154" width="340" height="38" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
  <rect x="754" y="154" width="476" height="38" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
  <rect x="34" y="204" width="160" height="36" rx="10" fill="#2563eb" />
  <text class="text" x="86" y="228" font-size="13" fill="#ffffff">Search</text>
  <rect x="206" y="204" width="160" height="36" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
  <text class="muted" x="250" y="228" font-size="13">Last 24h</text>
  <rect x="378" y="204" width="120" height="36" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" />
  <text class="muted" x="420" y="228" font-size="13">Clear</text>

  <rect class="card" x="16" y="272" width="1248" height="420" rx="14" />
  <text class="muted" x="34" y="308" font-size="12">Results (sample)</text>
  <rect x="34" y="324" width="1212" height="44" rx="10" fill="#fcfcfd" stroke="#d0d5dd" stroke-width="2" />
  <text class="muted" x="52" y="352" font-size="12">Time</text>
  <text class="muted" x="220" y="352" font-size="12">Node</text>
  <text class="muted" x="340" y="352" font-size="12">From</text>
  <text class="muted" x="620" y="352" font-size="12">To</text>
  <text class="muted" x="900" y="352" font-size="12">Status</text>
  <text class="muted" x="1040" y="352" font-size="12">Size</text>
  <text class="muted" x="1120" y="352" font-size="12">MsgID</text>

  <rect x="34" y="380" width="1212" height="56" rx="10" fill="#ffffff" stroke="#eef2f6" stroke-width="2" />
  <text class="mono" x="52" y="414" font-size="12">2026-05-08 10:23</text>
  <text class="mono" x="220" y="414" font-size="12">node1</text>
  <rect class="pillOk" x="900" y="394" width="120" height="28" rx="999" />
  <text class="mono" x="925" y="413" font-size="12">accepted</text>

  <rect x="34" y="446" width="1212" height="56" rx="10" fill="#f9fafb" stroke="#eef2f6" stroke-width="2" />
  <text class="mono" x="52" y="480" font-size="12">2026-05-08 10:22</text>
  <text class="mono" x="220" y="480" font-size="12">node2</text>
  <rect class="pillWarn" x="900" y="460" width="120" height="28" rx="999" />
  <text class="mono" x="930" y="479" font-size="12">deferred</text>

  <rect x="34" y="512" width="1212" height="56" rx="10" fill="#ffffff" stroke="#eef2f6" stroke-width="2" />
  <text class="mono" x="52" y="546" font-size="12">2026-05-08 10:21</text>
  <text class="mono" x="220" y="546" font-size="12">node3</text>
  <rect class="pillBad" x="900" y="526" width="120" height="28" rx="999" />
  <text class="mono" x="935" y="545" font-size="12">blocked</text>
</svg>
